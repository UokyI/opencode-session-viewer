<script>
const $ = (id) => document.getElementById(id);

function icon(name) {
  return `<svg class="icon" aria-hidden="true"><use href="#icon-${name}"></use></svg>`;
}

function escapeHtml(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, (character) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;',
  })[character]);
}

// ─── Theme ───────────────────────────────────────────────────
function syncThemeControl() {
  const theme = document.documentElement.dataset.theme;
  const button = $('themeToggle');
  if (!button) return;
  const next = theme === 'dark' ? '浅色' : '深色';
  button.title = `切换到${next}主题`;
  button.setAttribute('aria-label', `切换到${next}主题`);
}

function toggleTheme() {
  const current = document.documentElement.dataset.theme;
  const next = current === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  try {
    localStorage.setItem('opencode-theme', next);
  } catch (error) {
    // Local storage can be unavailable in hardened browser contexts.
  }
  syncThemeControl();
}

// ─── State ───────────────────────────────────────────────────
const state = {
  page: 1,
  limit: 20,
  sort: 'desc',
  query: '',
  searchContent: false,
  showChildren: false,
  total: 0,
  totalPages: 0,
  sessions: [],
  expandedSessions: new Set(),
  pendingSessions: new Set(),
  sessionMessages: {},
  searchTimer: null,
};

let loadSequence = 0;
let settingsDatabases = [];

function sessionKey(session) {
  return `${session.db || 'default'}:${session.id}`;
}

function sessionDbId(session) {
  return session.db || 'default';
}

// ─── API ─────────────────────────────────────────────────────
async function api(path) {
  const response = await fetch(path);
  if (!response.ok) {
    const error = await response.json().catch(() => ({ error: `HTTP ${response.status}` }));
    throw new Error(error.error || `HTTP ${response.status}`);
  }
  return response.json();
}

// ─── Loading ─────────────────────────────────────────────────
function loadingMarkup() {
  return `<div class="loading-state"><span class="spinner" aria-hidden="true"></span><span>正在读取会话</span></div>`;
}

function inlineLoadingMarkup() {
  return `<div class="loading-inline"><span class="spinner" aria-hidden="true"></span><span>正在读取输入</span></div>`;
}

function setBusy(busy) {
  const refresh = $('refreshBtn');
  const list = $('sessionList');
  refresh.classList.toggle('is-loading', busy);
  refresh.disabled = busy;
  list.setAttribute('aria-busy', String(busy));
}

function showError(message) {
  $('errorText').textContent = message;
  $('error').hidden = false;
}

function hideError() {
  $('error').hidden = true;
}

let toastTimer = null;

function showToast(message, type) {
  const toast = $('toast');
  clearTimeout(toastTimer);
  toast.textContent = message;
  toast.classList.toggle('is-error', type === 'error');
  toast.hidden = false;
  toastTimer = setTimeout(() => {
    toast.hidden = true;
  }, type === 'error' ? 6000 : 3200);
}

async function loadSessions() {
  const sequence = ++loadSequence;
  const list = $('sessionList');
  hideError();
  setBusy(true);

  if (state.sessions.length === 0) {
    list.innerHTML = loadingMarkup();
  } else {
    list.classList.add('is-busy');
  }

  try {
    const query = state.query ? `&q=${encodeURIComponent(state.query)}` : '';
    const content = state.searchContent ? '&content=1' : '';
    const children = state.showChildren ? '&children=1' : '';
    const data = await api(`/api/sessions?page=${state.page}&limit=${state.limit}&sort=${state.sort}${query}${content}${children}`);
    if (sequence !== loadSequence) return;

    state.sessions = Array.isArray(data.sessions) ? data.sessions : [];
    state.total = data.total || 0;
    state.totalPages = Math.max(1, data.total_pages || 1);
    state.expandedSessions.clear();
    state.pendingSessions.clear();
    state.sessionMessages = {};

    renderHeader(data);
    renderSessions();
    renderPagination();
  } catch (error) {
    if (sequence !== loadSequence) return;
    showError(`无法读取会话：${error.message}`);
    if (state.sessions.length === 0) list.innerHTML = '';
  } finally {
    if (sequence === loadSequence) {
      setBusy(false);
      list.classList.remove('is-busy');
    }
  }
}

// ─── Formatting ──────────────────────────────────────────────
function timeParts(value) {
  if (!value) return { date: '—', time: '', full: '—', iso: '' };
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return { date: '—', time: '', full: '—', iso: '' };
  const pad = (number) => String(number).padStart(2, '0');
  const year = date.getFullYear();
  const month = pad(date.getMonth() + 1);
  const day = pad(date.getDate());
  const hours = pad(date.getHours());
  const minutes = pad(date.getMinutes());
  return {
    date: `${year}.${month}.${day}`,
    time: `${hours}:${minutes}`,
    full: `${year}-${month}-${day} ${hours}:${minutes}`,
    iso: date.toISOString(),
  };
}

function formatNum(value) {
  const number = Number(value) || 0;
  if (number >= 1000000) return `${(number / 1000000).toFixed(1)}M`;
  if (number >= 1000) return `${(number / 1000).toFixed(1)}k`;
  return String(number);
}

function formatCost(value) {
  if (value == null || Number(value) === 0) return null;
  return `$${Number(value).toFixed(4)}`;
}

function renderHeader(data) {
  const search = state.query
    ? `<span class="header-query" title="搜索：${escapeHtml(state.query)}">搜索 “${escapeHtml(state.query)}”</span>`
    : '';
  $('headerStats').innerHTML = `
    <span>共 <strong>${data.total}</strong> 个会话</span>
    ${search}
    <span class="header-page">第 ${data.page} / ${data.total_pages} 页</span>`;
}

// ─── Rendering ───────────────────────────────────────────────
function figureMarkup(value, label, className) {
  return `<span class="figure ${className || ''}">
    <span class="figure-value">${escapeHtml(value)}</span>
    <span class="figure-label">${escapeHtml(label)}</span>
  </span>`;
}

function usageItemMarkup(value, label, className) {
  return `<span class="usage-item ${className || ''}">
    <span class="usage-label">${escapeHtml(label)}</span>
    <span class="usage-value">${escapeHtml(value)}</span>
  </span>`;
}

function modelNameFor(session) {
  if (!session.model) return '';
  if (typeof session.model === 'string') return session.model;
  return session.model.variant || session.model.id || session.model.name || session.model.providerID || '';
}

function emptyMarkup() {
  const searching = Boolean(state.query);
  return `<div class="empty-state">
    <h2 class="empty-title">${searching ? '没有匹配的会话' : '还没有会话记录'}</h2>
    <p class="empty-copy">${searching
      ? '换个关键词试试，或清除搜索查看全部会话。'
      : '使用 OpenCode 开始一次会话后，刷新此页。'}</p>
    ${searching ? '<button class="text-button" type="button" data-action="clear-search">清除搜索</button>' : ''}
  </div>`;
}

function renderSessions() {
  const list = $('sessionList');
  if (state.sessions.length === 0) {
    list.innerHTML = emptyMarkup();
    return;
  }

  list.innerHTML = state.sessions.map((session, index) => {
    const created = timeParts(session.time_created);
    const updated = timeParts(session.time_updated);
    const inputs = Number(session.user_message_count) || 0;
    const directory = session.directory || session.path || '';
    const agent = session.agent || '';
    const model = modelNameFor(session);
    const isOpen = state.expandedSessions.has(sessionKey(session));

    const inputTokens = Number(session.tokens_input) || 0;
    const outputTokens = Number(session.tokens_output) || 0;
    const totalTokens = inputTokens + outputTokens;
    const cacheHit = Number(session.tokens_cache_read) || 0;
    const cacheMiss = Number(session.tokens_cache_write) || 0;
    const cacheTotal = cacheHit + cacheMiss;
    const cacheRatio = cacheTotal > 0
      ? ((cacheHit / (inputTokens + cacheHit + cacheMiss)) * 100).toFixed(1)
      : null;
    const cost = formatCost(session.cost);
    const title = session.title || '未命名会话';
    const detailId = `detail-${index}`;

    const pathLine = directory
      ? `<div class="session-path-line">
          ${icon('folder')}
          <code class="session-path" title="${escapeHtml(directory)}">${escapeHtml(directory)}</code>
          <button class="mini-button" type="button" data-action="copy-path" data-index="${index}" title="复制路径" aria-label="复制路径">${icon('copy')}</button>
          <button class="mini-button" type="button" data-action="open-folder" data-index="${index}" title="打开文件夹" aria-label="打开文件夹">${icon('open')}</button>
        </div>`
      : '';

    const meta = [
      `<span class="meta-item meta-date"><time datetime="${created.iso}">${created.full}</time></span>`,
    ];
    if (agent) {
      meta.push(`<span class="meta-item meta-agent" title="代理"><span class="meta-key">代理</span>${escapeHtml(agent)}</span>`);
    }
    if (model) {
      meta.push(`<span class="meta-item meta-model" title="模型"><span class="meta-key">模型</span>${escapeHtml(model)}</span>`);
    }
    meta.push(`<span class="meta-item">${icon('chat')}<span>${inputs} 次输入</span></span>`);
    if (session.db && session.db !== 'default') {
      meta.push(`<span class="meta-item meta-db" title="${escapeHtml(session.db_label || '自定义数据库')}">${icon('database')}<span>${escapeHtml(session.db_label || '自定义库')}</span></span>`);
    }
    if (session.time_updated && updated.full !== created.full) {
      meta.push(`<span class="meta-item">更新 ${updated.full}</span>`);
    }

    const tokenFigure = figureMarkup(
      totalTokens > 0 ? formatNum(totalTokens) : '—',
      'tokens',
      totalTokens > 0 ? '' : 'figure-empty',
    );
    const cacheFigure = figureMarkup(
      cacheRatio == null ? '—' : `${cacheRatio}%`,
      '缓存命中',
      cacheRatio == null ? 'figure-empty' : 'figure-cache',
    );
    const costFigure = figureMarkup(
      cost || '—',
      '花费',
      cost ? '' : 'figure-empty',
    );
    const usageHtml = `<div class="session-usage" role="group" aria-label="Token 用量明细">
      ${usageItemMarkup(formatNum(totalTokens), '总 tokens')}
      ${usageItemMarkup(formatNum(inputTokens), '输入')}
      ${usageItemMarkup(formatNum(outputTokens), '输出')}
      ${usageItemMarkup(formatNum(cacheHit), '缓存命中', cacheHit > 0 ? 'is-hit' : '')}
      ${usageItemMarkup(formatNum(cacheMiss), '缓存未命中')}
    </div>`;

    return `<article class="session ${isOpen ? 'is-open' : ''}" data-session-id="${escapeHtml(session.id)}" aria-labelledby="session-title-${index}">
      <div class="session-summary" data-index="${index}">
        <div class="session-date">
          <time class="date-primary" datetime="${created.iso}">${created.full}</time>
        </div>
        <div class="session-main">
          <h2 class="session-title" id="session-title-${index}" title="${escapeHtml(title)}">${escapeHtml(title)}</h2>
          <div class="session-id-line">
            <code class="session-id" title="${escapeHtml(session.id)}">${escapeHtml(session.id)}</code>
            <button class="mini-button" type="button" data-action="open-session" data-index="${index}" title="在 opencode 中打开此会话" aria-label="在 opencode 中打开此会话">${icon('terminal')}</button>
            <button class="mini-button" type="button" data-action="copy" data-index="${index}" title="复制会话 ID" aria-label="复制会话 ID">${icon('copy')}</button>
            <button class="mini-button" type="button" data-action="export" data-index="${index}" title="导出会话 JSON" aria-label="导出会话 JSON">${icon('download')}</button>
          </div>
          ${pathLine}
          <div class="session-meta">${meta.join('')}</div>
        </div>
        <div class="session-figures">${tokenFigure}${cacheFigure}${costFigure}</div>
        <button class="session-chevron" type="button" data-action="toggle" data-index="${index}" aria-expanded="${isOpen}" aria-controls="${detailId}" aria-label="${isOpen ? '收起会话' : '展开会话'}：${escapeHtml(title)}">
          ${icon('chevron')}
        </button>
      </div>
      <div class="session-detail" id="${detailId}" aria-hidden="${isOpen ? 'false' : 'true'}" ${isOpen ? '' : 'inert'}>
        <div class="session-detail-clip">
          ${usageHtml}
          <div class="detail-inner">
            <div class="detail-label" aria-hidden="true">
              <span>用户输入</span>
              <span class="detail-count">最近 ${Math.min(10, inputs)} 条</span>
            </div>
            <div class="detail-main">
              <div class="detail-toolbar">
                <button class="detail-full-button" type="button" data-action="show-conversation" data-index="${index}" title="查看完整对话交互记录">
                  ${icon('chat')}<span>完整对话</span>
                </button>
              </div>
              <div id="msgs-${index}">
                ${isOpen ? inlineLoadingMarkup() : ''}
              </div>
            </div>
          </div>
        </div>
      </div>
    </article>`;
  }).join('');
}

function renderMessages(index, messages) {
  const container = $(`msgs-${index}`);
  if (!container) return;

  if (!messages || messages.length === 0) {
    container.innerHTML = '<div class="empty-inline">这个会话还没有用户输入。</div>';
    return;
  }

  container.innerHTML = messages.map((message) => {
    const time = timeParts(message.time_created);
    return `<div class="message">
      <div class="message-head">
        <time class="message-time" datetime="${time.iso}">${time.full}</time>
        ${message.agent ? `<span class="message-agent">${escapeHtml(message.agent)}</span>` : ''}
        ${message.id ? `<button class="mini-button message-fork" type="button" data-action="fork" data-index="${index}" data-message-id="${escapeHtml(message.id)}" title="由此输入创建分支会话" aria-label="由此输入创建分支会话">${icon('fork')}</button>` : ''}
      </div>
      <p class="message-text">${escapeHtml(message.text || '(空输入)')}</p>
    </div>`;
  }).join('');
}

// ─── Conversation modal ──────────────────────────────────────
let conversationSessionId = null;
let conversationDbId = null;
let conversationTrigger = null;
let conversationRenderToken = 0;

function conversationStatusLabel(status) {
  return ({
    completed: '完成',
    error: '失败',
    running: '运行中',
    pending: '等待',
  })[status] || status || '未知';
}

function conversationPartMarkup(part) {
  if (!part) return '';

  if (part.type === 'text') {
    if (!part.text) return '';
    return `<div class="conv-text">${escapeHtml(part.text)}</div>`;
  }

  if (part.type === 'reasoning') {
    if (!part.text) return '';
    return `<details class="conv-part conv-reasoning">
      <summary>${icon('chat')}<span>思考过程</span></summary>
      <pre class="conv-pre">${escapeHtml(part.text)}</pre>
    </details>`;
  }

  if (part.type === 'tool') {
    const status = part.status || 'unknown';
    const statusClass = ['completed', 'error', 'running', 'pending'].includes(status) ? status : 'unknown';
    const title = part.title
      ? `<span class="conv-tool-summary">${escapeHtml(part.title)}</span>`
      : '';
    return `<details class="conv-part conv-tool">
      <summary>
        ${icon('terminal')}
        <span class="conv-tool-name">${escapeHtml(part.tool || '工具')}</span>
        ${title}
        <span class="conv-status conv-status-${statusClass}">${escapeHtml(conversationStatusLabel(status))}</span>
      </summary>
      <div class="conv-tool-body">
        ${part.input ? `<div class="conv-field"><span class="conv-field-label">输入</span><pre class="conv-pre">${escapeHtml(part.input)}</pre></div>` : ''}
        ${part.output ? `<div class="conv-field"><span class="conv-field-label">输出</span><pre class="conv-pre">${escapeHtml(part.output)}</pre></div>` : ''}
      </div>
    </details>`;
  }

  if (part.type === 'file') {
    return `<div class="conv-part conv-file">${icon('folder')}<span>${escapeHtml(part.filename || '文件')}</span></div>`;
  }

  if (part.type === 'patch') {
    const files = (part.files || []).map((file) => `<code>${escapeHtml(file)}</code>`).join('');
    return `<div class="conv-part conv-patch">${icon('download')}<span>改动${files}</span></div>`;
  }

  return '';
}

function conversationMessageMarkup(message) {
  const time = timeParts(message.time_created);
  const isUser = message.role === 'user';
  const meta = [];
  if (message.agent) meta.push(escapeHtml(message.agent));
  if (message.model) meta.push(escapeHtml(message.model));
  const cost = formatCost(message.cost);
  if (cost) meta.push(escapeHtml(cost));

  const parts = (message.parts || []).map(conversationPartMarkup).join('');
  const errorHtml = message.error
    ? `<div class="conv-error">${icon('alert')}<span>${escapeHtml(message.error)}</span></div>`
    : '';

  return `<article class="conv-message ${isUser ? 'conv-user' : 'conv-assistant'}">
    <div class="conv-message-head">
      <span class="conv-role">${isUser ? '用户' : '助手'}</span>
      <time class="conv-time" datetime="${time.iso}">${time.full}</time>
      ${meta.length ? `<span class="conv-meta">${meta.join(' · ')}</span>` : ''}
    </div>
    <div class="conv-parts">${parts}${errorHtml}</div>
  </article>`;
}

function renderConversation(data, sessionId) {
  const messages = Array.isArray(data.messages) ? data.messages : [];
  const title = data.session && data.session.title ? data.session.title : '完整对话';
  const meta = [sessionId, `${messages.length} 条消息`];
  if (data.session && data.session.directory) meta.push(data.session.directory);

  const titleEl = $('conversationTitle');
  titleEl.textContent = title;
  titleEl.title = title;
  $('conversationMeta').textContent = meta.join(' · ');

  const body = $('conversationBody');
  const token = ++conversationRenderToken;
  if (messages.length === 0) {
    body.innerHTML = '<div class="empty-inline">这个会话还没有对话记录。</div>';
    return;
  }

  body.innerHTML = '';
  appendConversationBatch(body, messages, 0, token);
}

function appendConversationBatch(body, messages, start, token) {
  if (token !== conversationRenderToken) return;

  const batch = messages.slice(start, start + 40);
  if (batch.length === 0) return;

  body.insertAdjacentHTML('beforeend', batch.map(conversationMessageMarkup).join(''));

  const next = start + batch.length;
  if (next < messages.length) {
    setTimeout(() => appendConversationBatch(body, messages, next, token), 0);
  }
}

async function loadConversation(sessionId, dbId) {
  const body = $('conversationBody');
  try {
    const db = dbId && dbId !== 'default' ? `?db=${encodeURIComponent(dbId)}` : '';
    const data = await api(`/api/sessions/${encodeURIComponent(sessionId)}/conversation${db}`);
    if (conversationSessionId !== sessionId || conversationDbId !== dbId) return;
    renderConversation(data, sessionId);
  } catch (error) {
    if (conversationSessionId !== sessionId || conversationDbId !== dbId) return;
    body.innerHTML = `<div class="inline-error">
      ${icon('alert')}
      <span>无法读取完整对话：${escapeHtml(error.message)}</span>
      <button class="text-button" type="button" data-action="retry-conversation">重试</button>
    </div>`;
  }
}

function openConversation(index, trigger) {
  const session = state.sessions[index];
  if (!session) return;

  conversationSessionId = session.id;
  conversationDbId = sessionDbId(session);
  conversationTrigger = trigger || null;
  conversationRenderToken += 1;

  const titleEl = $('conversationTitle');
  titleEl.textContent = session.title || '完整对话';
  titleEl.title = session.title || '完整对话';
  $('conversationMeta').textContent = conversationDbId === 'default'
    ? session.id
    : `${session.id} · ${session.db_label || conversationDbId}`;
  $('conversationBody').innerHTML = '<div class="loading-state"><span class="spinner" aria-hidden="true"></span><span>正在读取完整对话</span></div>';

  $('conversationModal').hidden = false;
  syncModalLock();
  $('conversationClose').focus();
  loadConversation(session.id, conversationDbId);
}

function closeConversation() {
  const modal = $('conversationModal');
  if (modal.hidden) return;

  conversationSessionId = null;
  conversationDbId = null;
  conversationRenderToken += 1;
  modal.hidden = true;
  syncModalLock();
  $('conversationBody').innerHTML = '';

  if (conversationTrigger && document.contains(conversationTrigger)) {
    conversationTrigger.focus();
  }
  conversationTrigger = null;
}

function trapModalFocus(event) {
  const modal = !$('settingsModal').hidden
    ? $('settingsModal')
    : $('conversationModal');
  const dialog = modal.querySelector('.conversation-dialog');
  if (!dialog) return;
  const focusable = Array.from(dialog.querySelectorAll(
    'button, summary, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])',
  )).filter((element) => !element.disabled && element.offsetParent !== null);
  if (focusable.length === 0) {
    event.preventDefault();
    return;
  }
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
}

function syncModalLock() {
  const anyOpen = !$('conversationModal').hidden || !$('settingsModal').hidden;
  document.body.classList.toggle('has-modal', anyOpen);
}

// ─── Settings / database sources ─────────────────────────────
function showSettingsHint(message, isError) {
  const hint = $('settingsHint');
  hint.textContent = message || '';
  hint.classList.toggle('is-error', Boolean(isError));
}

async function postSettings(payload) {
  const response = await fetch('/api/settings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
  settingsDatabases = Array.isArray(data.databases) ? data.databases : [];
  renderSettings();
  return data;
}

function renderSettings() {
  const master = $('settingsAll');
  const enabled = settingsDatabases.filter((db) => db.enabled).length;
  master.checked = settingsDatabases.length > 0 && enabled === settingsDatabases.length;
  master.indeterminate = enabled > 0 && enabled < settingsDatabases.length;

  const list = $('dbList');
  if (settingsDatabases.length === 0) {
    list.innerHTML = '<li class="empty-inline">没有可用的数据库。</li>';
    return;
  }

  list.innerHTML = settingsDatabases.map((db) => {
    const missing = !db.exists;
    const badge = db.builtin ? '<span class="db-badge">默认</span>' : '';
    const missingBadge = missing ? '<span class="db-badge is-missing">文件不存在</span>' : '';
    const remove = db.builtin
      ? ''
      : `<button class="mini-button" type="button" data-action="remove-db" data-db-id="${escapeHtml(db.id)}" title="移除数据库" aria-label="移除数据库">${icon('x')}</button>`;
    return `<li class="db-item ${missing ? 'is-missing' : ''}" data-db-id="${escapeHtml(db.id)}">
      <div class="db-main">
        <div class="db-head">
          <span class="db-label">${escapeHtml(db.label)}</span>
          ${badge}${missingBadge}
        </div>
        <code class="db-path" title="${escapeHtml(db.path)}">${escapeHtml(db.path)}</code>
      </div>
      <div class="db-actions">
        <button class="mini-button" type="button" data-action="download-db" data-db-id="${escapeHtml(db.id)}" title="下载此数据库" aria-label="下载此数据库" ${missing ? 'disabled' : ''}>${icon('download')}</button>
        ${remove}
        <label class="toggle-control" title="启用或停用此数据库">
          <span class="switch">
            <input type="checkbox" data-db-toggle="${escapeHtml(db.id)}" ${db.enabled ? 'checked' : ''} ${missing ? 'disabled' : ''}>
            <span class="switch-track" aria-hidden="true"></span>
          </span>
        </label>
      </div>
    </li>`;
  }).join('');
}

async function loadSettings() {
  showSettingsHint('正在读取数据库列表…');
  try {
    const data = await api('/api/settings');
    settingsDatabases = Array.isArray(data.databases) ? data.databases : [];
    renderSettings();
    showSettingsHint(settingsDatabases.length
      ? `共 ${settingsDatabases.length} 个数据库来源`
      : '没有可用的数据库');
  } catch (error) {
    showSettingsHint(`读取设置失败：${error.message}`, true);
  }
}

function openSettings() {
  $('settingsModal').hidden = false;
  syncModalLock();
  showSettingsHint('');
  $('settingsClose').focus();
  loadSettings();
}

function closeSettings() {
  const modal = $('settingsModal');
  if (modal.hidden) return;
  modal.hidden = true;
  syncModalLock();
}

async function setAllDatabases(enabled) {
  try {
    await postSettings({ action: 'set_all', enabled });
    showSettingsHint(enabled ? '已启用全部数据库' : '已停用全部数据库');
    await loadSessions();
  } catch (error) {
    showSettingsHint(error.message, true);
    renderSettings();
  }
}

async function toggleDatabase(dbId, enabled) {
  try {
    await postSettings({ action: 'set_enabled', id: dbId, enabled });
    showSettingsHint(enabled ? '已启用数据库' : '已停用数据库');
    await loadSessions();
  } catch (error) {
    showSettingsHint(error.message, true);
    renderSettings();
  }
}

async function addDatabase() {
  const input = $('newDbPath');
  const path = input.value.trim();
  if (!path) {
    showSettingsHint('请输入数据库文件路径', true);
    return;
  }
  try {
    await postSettings({ action: 'add', path });
    input.value = '';
    showSettingsHint('已添加数据库');
    await loadSessions();
  } catch (error) {
    showSettingsHint(error.message, true);
  }
}

async function removeDatabase(dbId) {
  try {
    await postSettings({ action: 'remove', id: dbId });
    showSettingsHint('已移除数据库');
    await loadSessions();
  } catch (error) {
    showSettingsHint(error.message, true);
  }
}

function downloadDatabaseById(dbId) {
  const suffix = dbId && dbId !== 'default' ? `?db=${encodeURIComponent(dbId)}` : '';
  showToast('正在下载数据库文件…');
  window.location.href = `/api/download-db${suffix}`;
}

function renderPagination() {
  const pagination = $('pagination');
  if (state.totalPages <= 1) {
    pagination.innerHTML = '';
    pagination.hidden = true;
    return;
  }

  const pages = [];
  const totalPages = state.totalPages;
  const currentPage = state.page;

  if (totalPages <= 7) {
    for (let page = 1; page <= totalPages; page += 1) pages.push(page);
  } else {
    pages.push(1);
    if (currentPage > 3) pages.push('...');
    for (let page = Math.max(2, currentPage - 1); page <= Math.min(totalPages - 1, currentPage + 1); page += 1) {
      pages.push(page);
    }
    if (currentPage < totalPages - 2) pages.push('...');
    pages.push(totalPages);
  }

  let numbers = '';
  for (const page of pages) {
    if (page === '...') {
      numbers += '<span class="page-ellipsis">…</span>';
    } else {
      numbers += `<button class="page-btn ${page === currentPage ? 'is-active' : ''}" type="button" data-page="${page}" ${page === currentPage ? 'aria-current="page"' : ''} aria-label="第 ${page} 页">${page}</button>`;
    }
  }

  pagination.innerHTML = `
    <button class="page-btn" type="button" data-page="${currentPage - 1}" ${currentPage === 1 ? 'disabled' : ''} aria-label="上一页">${icon('arrow-left')}</button>
    <div class="page-numbers">${numbers}</div>
    <button class="page-btn" type="button" data-page="${currentPage + 1}" ${currentPage === totalPages ? 'disabled' : ''} aria-label="下一页">${icon('arrow-right')}</button>
    <span class="pagination-info">第 ${currentPage} 页，共 ${totalPages} 页</span>`;
  pagination.hidden = false;
}

// ─── Actions ─────────────────────────────────────────────────
const restoreTimers = new WeakMap();

function showButtonFeedback(button, type, label, delay = 1600) {
  if (!button.dataset.originalHtml) {
    button.dataset.originalHtml = button.innerHTML;
    button.dataset.originalTitle = button.title;
    button.dataset.originalLabel = button.getAttribute('aria-label') || '';
  }

  clearTimeout(restoreTimers.get(button));
  button.classList.remove('is-success', 'is-error', 'is-loading');
  button.removeAttribute('aria-busy');
  if (type === 'loading') {
    button.classList.add('is-loading');
    button.setAttribute('aria-busy', 'true');
  }
  if (type === 'success') button.classList.add('is-success');
  if (type === 'error') button.classList.add('is-error');

  button.innerHTML = type === 'loading'
    ? '<svg class="mini-spinner" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="30 8"/></svg>'
    : icon(type === 'success' ? 'check' : 'alert');
  button.title = label;
  button.setAttribute('aria-label', label);

  if (type !== 'loading') {
    const timer = setTimeout(() => {
      button.innerHTML = button.dataset.originalHtml;
      button.title = button.dataset.originalTitle;
      button.setAttribute('aria-label', button.dataset.originalLabel);
      button.classList.remove('is-success', 'is-error', 'is-loading');
      button.removeAttribute('aria-busy');
      delete button.dataset.originalHtml;
      delete button.dataset.originalTitle;
      delete button.dataset.originalLabel;
    }, delay);
    restoreTimers.set(button, timer);
  }
}

async function writeClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      return;
    } catch (error) {
      // Fall through to the selection-based fallback.
    }
  }

  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  const copied = document.execCommand('copy');
  document.body.removeChild(textarea);
  if (!copied) throw new Error('Clipboard unavailable');
}

async function copySessionId(index, button) {
  const session = state.sessions[index];
  if (!session) return;
  try {
    await writeClipboard(session.id);
    showButtonFeedback(button, 'success', '已复制会话 ID');
  } catch (error) {
    showButtonFeedback(button, 'error', '复制失败');
  }
}

async function copySessionPath(index, button) {
  const session = state.sessions[index];
  const folder = session && (session.directory || session.path);
  if (!folder) return;
  try {
    await writeClipboard(folder);
    showButtonFeedback(button, 'success', '已复制路径');
  } catch (error) {
    showButtonFeedback(button, 'error', '复制失败');
  }
}

async function openSessionFolder(index, button) {
  const session = state.sessions[index];
  const folder = session && (session.directory || session.path);
  if (!folder) return;

  button.disabled = true;
  showButtonFeedback(button, 'loading', '正在打开文件夹');

  try {
    const response = await fetch('/api/open-folder', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: folder }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    showButtonFeedback(button, 'success', '文件夹已打开');
  } catch (error) {
    showButtonFeedback(button, 'error', `无法打开文件夹：${error.message}`, 2600);
    showToast(`无法打开文件夹：${error.message}`, 'error');
  } finally {
    button.disabled = false;
  }
}

async function exportSession(index, button) {
  const session = state.sessions[index];
  if (!session) return;

  button.disabled = true;
  showButtonFeedback(button, 'loading', '正在导出会话');

  try {
    const response = await fetch(`/api/sessions/${encodeURIComponent(session.id)}/export`);
    if (!response.ok) {
      const error = await response.json().catch(() => ({ error: `HTTP ${response.status}` }));
      throw new Error(error.error || `HTTP ${response.status}`);
    }

    const data = await response.json();
    const now = new Date();
    const stamp = [
      now.getFullYear(),
      String(now.getMonth() + 1).padStart(2, '0'),
      String(now.getDate()).padStart(2, '0'),
      String(now.getHours()).padStart(2, '0'),
      String(now.getMinutes()).padStart(2, '0'),
      String(now.getSeconds()).padStart(2, '0'),
    ].join('');
    const safeTitle = (session.title || 'session')
      .replace(/[\\/:*?"<>|]/g, '_')
      .replace(/\s+/g, '_')
      .slice(0, 80);
    const filename = `${safeTitle}_${stamp}.json`;

    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = filename;
    document.body.appendChild(anchor);
    anchor.click();
    document.body.removeChild(anchor);
    URL.revokeObjectURL(url);

    showButtonFeedback(button, 'success', '会话已导出');
    showToast(`已导出 ${filename}`);
  } catch (error) {
    showButtonFeedback(button, 'error', `导出失败：${error.message}`, 2400);
    showToast(`导出失败：${error.message}`, 'error');
  } finally {
    button.disabled = false;
  }
}

async function openSessionInOpencode(index, button) {
  const session = state.sessions[index];
  if (!session) return;

  button.disabled = true;
  showButtonFeedback(button, 'loading', '正在打开 opencode');

  try {
    const response = await fetch(`/api/sessions/${encodeURIComponent(session.id)}/open`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: '{}',
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      const message = data.error || '';
      if (response.status === 404 && (!message || message === 'Not Found')) {
        throw new Error('当前服务未加载新接口，请重启 viewer 服务');
      }
      throw new Error(message || `HTTP ${response.status}`);
    }
    showButtonFeedback(button, 'success', 'opencode 已启动');
    showToast('已在 opencode 中打开此会话');
  } catch (error) {
    showButtonFeedback(button, 'error', `打开失败：${error.message}`, 3000);
    showToast(`打开 opencode 失败：${error.message}`, 'error');
  } finally {
    button.disabled = false;
  }
}

async function forkSessionFromMessage(index, messageId, button) {
  const session = state.sessions[index];
  if (!session || !messageId) return;

  button.disabled = true;
  showButtonFeedback(button, 'loading', '正在创建分支会话');

  try {
    const response = await fetch(`/api/sessions/${encodeURIComponent(session.id)}/fork`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messageID: messageId }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      const message = data.error || '';
      if (response.status === 404 && (!message || message === 'Not Found')) {
        throw new Error('当前服务未加载新接口，请重启 viewer 服务');
      }
      throw new Error(message || `HTTP ${response.status}`);
    }

    const forked = data.session || {};
    showButtonFeedback(button, 'success', '分支会话已创建');
    showToast(`已创建分支会话${forked.id ? ` ${forked.id}` : ''}`);
    await loadSessions();
  } catch (error) {
    showButtonFeedback(button, 'error', `创建分支失败：${error.message}`, 3000);
    showToast(`创建分支失败：${error.message}`, 'error');
  } finally {
    button.disabled = false;
  }
}

async function loadSessionMessages(index) {
  const session = state.sessions[index];
  const container = $(`msgs-${index}`);
  if (!session || !container) return;

  container.innerHTML = inlineLoadingMarkup();
  const key = sessionKey(session);
  const db = encodeURIComponent(sessionDbId(session));

  try {
    const data = await api(`/api/sessions/${encodeURIComponent(session.id)}/messages?limit=10&db=${db}`);
    state.sessionMessages[key] = Array.isArray(data.messages) ? data.messages : [];
    renderMessages(index, state.sessionMessages[key]);
  } catch (error) {
    container.innerHTML = `<div class="inline-error">
      ${icon('alert')}
      <span>无法读取输入</span>
      <button class="text-button" type="button" data-action="retry-messages" data-index="${index}">重试</button>
    </div>`;
  }
}

async function toggleSession(index) {
  const session = state.sessions[index];
  const card = $('sessionList').querySelectorAll('.session')[index];
  if (!session || !card) return;

  const detail = $(`detail-${index}`);
  const chevron = card.querySelector('[data-action="toggle"]');
  const title = session.title || '未命名会话';
  const key = sessionKey(session);
  const isOpen = state.expandedSessions.has(key);

  if (isOpen) {
    state.expandedSessions.delete(key);
    card.classList.remove('is-open');
    detail.setAttribute('aria-hidden', 'true');
    detail.inert = true;
    chevron.setAttribute('aria-expanded', 'false');
    chevron.setAttribute('aria-label', `展开会话：${title}`);
    return;
  }

  if (state.pendingSessions.has(key)) return;

  state.expandedSessions.add(key);
  chevron.setAttribute('aria-expanded', 'true');
  chevron.setAttribute('aria-label', `收起会话：${title}`);

  if (state.sessionMessages[key]) {
    renderMessages(index, state.sessionMessages[key]);
  } else {
    state.pendingSessions.add(key);
    await loadSessionMessages(index);
    state.pendingSessions.delete(key);
  }

  if (!state.expandedSessions.has(key)) return;

  detail.inert = false;
  detail.setAttribute('aria-hidden', 'false');
  card.classList.add('is-open');
}

function handleListClick(event) {
  const actionTarget = event.target.closest('[data-action]');
  if (actionTarget) {
    const index = Number(actionTarget.dataset.index);
    const action = actionTarget.dataset.action;
    if (action === 'toggle') toggleSession(index);
    if (action === 'copy') copySessionId(index, actionTarget);
    if (action === 'copy-path') copySessionPath(index, actionTarget);
    if (action === 'open-folder') openSessionFolder(index, actionTarget);
    if (action === 'open-session') openSessionInOpencode(index, actionTarget);
    if (action === 'export') exportSession(index, actionTarget);
    if (action === 'fork') forkSessionFromMessage(index, actionTarget.dataset.messageId, actionTarget);
    if (action === 'retry-messages') loadSessionMessages(index);
    if (action === 'show-conversation') openConversation(index, actionTarget);
    if (action === 'clear-search') clearSearch();
    return;
  }

  const summary = event.target.closest('.session-summary');
  if (summary) toggleSession(Number(summary.dataset.index));
}

// ─── Navigation and filters ──────────────────────────────────
function goPage(page) {
  if (page < 1 || page > state.totalPages || page === state.page) return;
  state.page = page;
  loadSessions();
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
}

function changePageSize() {
  state.limit = Number($('pageSize').value) || 20;
  state.page = 1;
  loadSessions();
}

function changeSort() {
  state.sort = $('sortOrder').value;
  state.page = 1;
  loadSessions();
}

function syncSearchContentUI() {
  $('searchInput').placeholder = state.searchContent
    ? '搜索会话 ID、标题或内容'
    : '搜索会话 ID 或标题';
}

function toggleSearchContent() {
  state.searchContent = $('searchContent').checked;
  syncSearchContentUI();
  state.page = 1;
  loadSessions();
}

function toggleShowChildren() {
  state.showChildren = $('showChildren').checked;
  state.page = 1;
  loadSessions();
}

function downloadDatabase() {
  downloadDatabaseById('default');
}

function updateClearButton() {
  $('clearSearch').hidden = $('searchInput').value.length === 0;
}

function onSearchInput() {
  updateClearButton();
  clearTimeout(state.searchTimer);
  state.searchTimer = setTimeout(() => {
    state.query = $('searchInput').value.trim();
    state.page = 1;
    loadSessions();
  }, 300);
}

function clearSearch() {
  clearTimeout(state.searchTimer);
  $('searchInput').value = '';
  state.query = '';
  state.page = 1;
  updateClearButton();
  loadSessions();
  $('searchInput').focus();
}

function refreshSessions() {
  loadSessions();
}

// ─── Events ──────────────────────────────────────────────────
$('themeToggle').addEventListener('click', toggleTheme);
$('searchInput').addEventListener('input', onSearchInput);
$('clearSearch').addEventListener('click', clearSearch);
$('searchContent').addEventListener('change', toggleSearchContent);
$('showChildren').addEventListener('change', toggleShowChildren);
$('sortOrder').addEventListener('change', changeSort);
$('pageSize').addEventListener('change', changePageSize);
$('refreshBtn').addEventListener('click', refreshSessions);
$('downloadDb').addEventListener('click', downloadDatabase);
$('settingsBtn').addEventListener('click', openSettings);
$('settingsClose').addEventListener('click', closeSettings);
$('addDbBtn').addEventListener('click', addDatabase);
$('settingsAll').addEventListener('change', () => setAllDatabases($('settingsAll').checked));

$('newDbPath').addEventListener('keydown', (event) => {
  if (event.key !== 'Enter') return;
  event.preventDefault();
  addDatabase();
});

$('dbList').addEventListener('change', (event) => {
  const toggle = event.target.closest('[data-db-toggle]');
  if (!toggle) return;
  toggleDatabase(toggle.dataset.dbToggle, toggle.checked);
});

$('dbList').addEventListener('click', (event) => {
  const target = event.target.closest('[data-action]');
  if (!target) return;
  if (target.dataset.action === 'download-db') downloadDatabaseById(target.dataset.dbId);
  if (target.dataset.action === 'remove-db') removeDatabase(target.dataset.dbId);
});

$('retryBtn').addEventListener('click', loadSessions);
$('sessionList').addEventListener('click', handleListClick);
$('conversationClose').addEventListener('click', closeConversation);

$('conversationModal').addEventListener('click', (event) => {
  const target = event.target.closest('[data-action]');
  if (!target) return;
  if (target.dataset.action === 'close-conversation') {
    closeConversation();
  } else if (target.dataset.action === 'retry-conversation' && conversationSessionId) {
    $('conversationBody').innerHTML = '<div class="loading-state"><span class="spinner" aria-hidden="true"></span><span>正在读取完整对话</span></div>';
    loadConversation(conversationSessionId, conversationDbId);
  }
});

$('settingsModal').addEventListener('click', (event) => {
  const target = event.target.closest('[data-action]');
  if (target && target.dataset.action === 'close-settings') closeSettings();
});

$('pagination').addEventListener('click', (event) => {
  const button = event.target.closest('[data-page]');
  if (!button || button.disabled) return;
  goPage(Number(button.dataset.page));
});

document.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey) return;

  const conversationOpen = !$('conversationModal').hidden;
  const settingsOpen = !$('settingsModal').hidden;
  if (conversationOpen || settingsOpen) {
    if (event.key === 'Escape') {
      event.preventDefault();
      if (settingsOpen) closeSettings();
      else closeConversation();
      return;
    }
    if (event.key === 'Tab') {
      trapModalFocus(event);
      return;
    }
  }

  if (event.target.closest('input, select, textarea, [contenteditable="true"]')) return;

  if (event.key === 'ArrowLeft') {
    event.preventDefault();
    goPage(state.page - 1);
  } else if (event.key === 'ArrowRight') {
    event.preventDefault();
    goPage(state.page + 1);
  } else if (event.key === 'Escape' && state.query) {
    event.preventDefault();
    clearSearch();
  }
});

// ─── Init ────────────────────────────────────────────────────
syncThemeControl();
syncSearchContentUI();
updateClearButton();
loadSessions();
</script>

</html>
