<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Sessions · OpenCode</title>
<script>
  (function () {
    try {
      var saved = localStorage.getItem('opencode-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
    } catch (error) {
      document.documentElement.dataset.theme = 'light';
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ── Tokens ───────────────────────────────────────────────── */
  :root {
    color-scheme: light;
    --bg: #e9f1f7;
    --bg-deep: #dce8f2;
    --halo-1: rgba(167, 158, 184, 0.55);
    --halo-2: rgba(205, 216, 204, 0.45);
    --halo-3: rgba(170, 201, 177, 0.42);
    --surface: rgba(255, 255, 255, 0.52);
    --surface-strong: rgba(255, 255, 255, 0.82);
    --surface-soft: rgba(255, 255, 255, 0.28);
    --chrome: rgba(248, 252, 255, 0.58);
    --glass-top: rgba(255, 255, 255, 0.76);
    --glass-bottom: rgba(255, 255, 255, 0.38);
    --glass-border: rgba(255, 255, 255, 0.72);
    --glass-edge: rgba(30, 70, 105, 0.09);
    --glass-shadow: 0 20px 44px -24px rgba(24, 62, 96, 0.38), 0 2px 6px rgba(24, 62, 96, 0.06);
    --sheen: rgba(255, 255, 255, 0.92);
    --ink: #0f1d2c;
    --ink-soft: #2c4055;
    --muted: #51687e;
    --faint: #6b8095;
    --line: rgba(23, 56, 86, 0.11);
    --line-strong: rgba(23, 56, 86, 0.2);
    --accent: #0f68d6;
    --accent-strong: #0a4fa9;
    --accent-wash: rgba(15, 104, 214, 0.1);
    --accent-glow: rgba(15, 104, 214, 0.3);
    --positive: #0d7868;
    --danger: #ad3b2c;
    --danger-wash: rgba(173, 59, 44, 0.08);
    --focus-ring: 0 0 0 3px var(--accent-wash);
    --date-col: 136px;
    --figures-col: 232px;
    --radius: 8px;
    --radius-lg: 10px;
    --radius-xl: 12px;
    --pill: 999px;
    --blur: blur(18px) saturate(150%);
    --font-sans: 'Archivo', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: 'IBM Plex Mono', 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace;
  }

  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #07131e;
    --bg-deep: #0a1a27;
    --halo-1: rgba(31, 118, 148, 0.34);
    --halo-2: rgba(58, 92, 190, 0.26);
    --halo-3: rgba(24, 128, 111, 0.24);
    --surface: rgba(20, 38, 54, 0.55);
    --surface-strong: rgba(28, 49, 68, 0.8);
    --surface-soft: rgba(20, 38, 54, 0.28);
    --chrome: rgba(13, 27, 40, 0.6);
    --glass-top: rgba(43, 69, 92, 0.5);
    --glass-bottom: rgba(16, 31, 45, 0.44);
    --glass-border: rgba(173, 214, 243, 0.16);
    --glass-edge: rgba(173, 214, 243, 0.08);
    --glass-shadow: 0 24px 52px -26px rgba(0, 0, 0, 0.85), 0 2px 8px rgba(0, 0, 0, 0.3);
    --sheen: rgba(255, 255, 255, 0.14);
    --ink: #e9f3fb;
    --ink-soft: #bdcedd;
    --muted: #93a9bc;
    --faint: #7f95a9;
    --line: rgba(163, 205, 235, 0.12);
    --line-strong: rgba(163, 205, 235, 0.22);
    --accent: #7cc4ff;
    --accent-strong: #a8d8ff;
    --accent-wash: rgba(124, 196, 255, 0.12);
    --accent-glow: rgba(124, 196, 255, 0.34);
    --positive: #6fd8bc;
    --danger: #ffa896;
    --danger-wash: rgba(255, 168, 150, 0.09);
  }

  /* ── Base ─────────────────────────────────────────────────── */
  * { box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
    background: linear-gradient(180deg, var(--bg), var(--bg-deep));
    min-height: 100%;
  }

  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }

  body {
    position: relative;
    isolation: isolate;
    margin: 0;
    min-height: 100vh;
    background: transparent;
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body::before {
    content: "";
    position: fixed;
    inset: -8vmax;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(38% 42% at 24% 22%, var(--halo-1), transparent 70%),
      radial-gradient(34% 38% at 78% 26%, var(--halo-2), transparent 68%),
      radial-gradient(44% 42% at 54% 88%, var(--halo-3), transparent 72%);
    filter: blur(22px) saturate(115%);
  }

  @media (prefers-reduced-motion: no-preference) {
    body::before { animation: drift 28s ease-in-out infinite alternate; }
  }

  ::selection {
    background: var(--accent);
    color: #ffffff;
  }

  ::-webkit-scrollbar { width: 12px; height: 12px; }

  ::-webkit-scrollbar-track { background: transparent; }

  ::-webkit-scrollbar-thumb {
    border: 3px solid transparent;
    border-radius: var(--pill);
    background: color-mix(in srgb, var(--muted) 34%, transparent);
    background-clip: content-box;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: color-mix(in srgb, var(--muted) 55%, transparent);
    background-clip: content-box;
  }

  [hidden] { display: none !important; }

  button, input, select { font: inherit; color: inherit; }

  button {
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
  }

  a { color: inherit; text-decoration: none; }

  .icon {
    width: 16px;
    height: 16px;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .svg-sprite {
    position: absolute;
    width: 0;
    height: 0;
    overflow: hidden;
  }

  .visually-hidden {
    position: absolute !important;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ── Header ───────────────────────────────────────────────── */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--chrome);
    border-bottom: 1px solid var(--glass-edge);
    -webkit-backdrop-filter: blur(22px) saturate(165%);
    backdrop-filter: blur(22px) saturate(165%);
    box-shadow: 0 1px 0 var(--sheen) inset;
  }

  .header-inner,
  .page {
    width: 100%;
    max-width: 1220px;
    margin: 0 auto;
    padding-right: 28px;
    padding-left: 28px;
  }

  .header-inner {
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .brand-mark {
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    flex: none;
    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: 8px;
    background:
      linear-gradient(150deg, color-mix(in srgb, var(--accent) 72%, #ffffff), var(--accent) 45%, var(--accent-strong));
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.6) inset,
      0 -3px 8px rgba(0, 20, 60, 0.22) inset,
      0 6px 16px -6px var(--accent-glow);
  }

  .brand-mark::after {
    content: "";
    display: block;
    width: 6px;
    height: 6px;
    border-radius: var(--pill);
    background: #ffffff;
    box-shadow: 0 0 8px 1px rgba(255, 255, 255, 0.9);
  }

  .brand-name {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .brand-divider {
    width: 1px;
    height: 12px;
    background: var(--line-strong);
  }

  .brand-source {
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 10.5px;
  }

  .header-tail {
    display: flex;
    align-items: center;
    gap: 16px;
    min-width: 0;
  }

  .header-stats {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 0;
    padding: 6px 14px;
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    background: var(--surface-soft);
    box-shadow: 0 1px 0 var(--sheen) inset;
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }

  .header-stats strong {
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 500;
  }

  .header-page {
    color: var(--faint);
    font-family: var(--font-mono);
    font-size: 11px;
  }

  .header-query {
    max-width: 22ch;
    overflow: hidden;
    color: var(--accent);
    text-overflow: ellipsis;
  }

  .icon-button {
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: none;
    border: 1px solid transparent;
    border-radius: var(--radius);
    color: var(--muted);
    transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
  }

  .icon-button:hover {
    border-color: var(--glass-border);
    background: var(--surface);
    box-shadow: 0 1px 0 var(--sheen) inset, 0 6px 14px -8px rgba(24, 62, 96, 0.35);
    color: var(--ink);
  }

  .theme-toggle,
  .download-db,
  .settings-button {
    border-color: var(--glass-border);
    border-radius: var(--radius-lg);
    background: linear-gradient(165deg, var(--glass-top), var(--glass-bottom));
    box-shadow: 0 1px 0 var(--sheen) inset, 0 4px 12px -8px rgba(24, 62, 96, 0.4);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
  }

  .theme-toggle:hover,
  .download-db:hover,
  .settings-button:hover { background: var(--surface-strong); }

  .icon-sun,
  [data-theme="dark"] .icon-moon { display: none; }

  [data-theme="dark"] .icon-sun { display: block; }

  /* ── Page frame ───────────────────────────────────────────── */
  .page {
    padding-top: 26px;
    padding-bottom: 24px;
  }

  .index-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding-bottom: 20px;
  }

  .search-field {
    position: relative;
    flex: 1;
    min-width: 220px;
    max-width: 580px;
  }

  .search-field > .icon {
    position: absolute;
    top: 50%;
    left: 12px;
    transform: translateY(-50%);
    color: var(--faint);
    pointer-events: none;
  }

  .search-field input {
    width: 100%;
    height: 38px;
    padding: 0 40px 0 38px;
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    background: linear-gradient(165deg, var(--glass-top), var(--glass-bottom));
    box-shadow: 0 1px 0 var(--sheen) inset, 0 8px 20px -14px rgba(24, 62, 96, 0.4);
    color: var(--ink);
    font-size: 13px;
    outline: none;
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    backdrop-filter: blur(14px) saturate(150%);
    transition: background-color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }

  .search-field input:hover { border-color: color-mix(in srgb, var(--accent) 24%, var(--glass-border)); }

  .search-field input:focus {
    border-color: color-mix(in srgb, var(--accent) 62%, transparent);
    background: var(--surface-strong);
    box-shadow: 0 0 0 3px var(--accent-wash), 0 0 24px -6px var(--accent-glow), 0 1px 0 var(--sheen) inset;
  }

  .search-field input::placeholder { color: var(--faint); }

  .clear-search {
    position: absolute;
    top: 50%;
    right: 6px;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translateY(-50%);
    border-radius: 6px;
    color: var(--faint);
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .clear-search:hover {
    background: var(--surface-soft);
    color: var(--ink);
  }

  .clear-search .icon { width: 13px; height: 13px; }

  .controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }

  .select-control {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
  }

  .select-shell {
    position: relative;
    display: block;
  }

  .select-shell select {
    height: 38px;
    padding: 0 30px 0 14px;
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    background: linear-gradient(165deg, var(--glass-top), var(--glass-bottom));
    box-shadow: 0 1px 0 var(--sheen) inset, 0 8px 20px -14px rgba(24, 62, 96, 0.4);
    color: var(--ink);
    font-size: 12.5px;
    cursor: pointer;
    outline: none;
    appearance: none;
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    backdrop-filter: blur(14px) saturate(150%);
    transition: background-color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }

  .select-shell select:hover { border-color: color-mix(in srgb, var(--accent) 24%, var(--glass-border)); }

  .select-shell select:focus {
    border-color: color-mix(in srgb, var(--accent) 62%, transparent);
    box-shadow: 0 0 0 3px var(--accent-wash), 0 0 24px -6px var(--accent-glow), 0 1px 0 var(--sheen) inset;
  }

  .select-shell .icon {
    position: absolute;
    top: 50%;
    right: 9px;
    width: 13px;
    height: 13px;
    transform: translateY(-50%);
    color: var(--faint);
    pointer-events: none;
  }

  .refresh-button {
    width: 38px;
    height: 38px;
    border-color: var(--glass-border);
    border-radius: var(--radius-lg);
    background: linear-gradient(165deg, var(--glass-top), var(--glass-bottom));
    box-shadow: 0 1px 0 var(--sheen) inset, 0 8px 20px -14px rgba(24, 62, 96, 0.4);
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    backdrop-filter: blur(14px) saturate(150%);
  }

  .refresh-button:disabled { cursor: wait; opacity: 0.65; }

  .toggle-control {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }

  .toggle-control .switch {
    position: relative;
    display: inline-flex;
    width: 34px;
    height: 20px;
    flex: none;
  }

  .switch input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }

  .switch-track {
    position: relative;
    width: 100%;
    height: 100%;
    border: 1px solid var(--line-strong);
    border-radius: var(--pill);
    background: var(--surface-soft);
    box-shadow: 0 1px 0 var(--sheen) inset;
    transition: background-color 0.18s ease, border-color 0.18s ease;
  }

  .switch-track::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--faint);
    transition: transform 0.18s ease, background-color 0.18s ease;
  }

  .switch input:checked + .switch-track {
    border-color: color-mix(in srgb, var(--accent) 45%, var(--line-strong));
    background: var(--accent-wash);
  }

  .switch input:checked + .switch-track::after {
    transform: translateX(14px);
    background: var(--accent);
  }

  .switch input:focus-visible + .switch-track {
    box-shadow: 0 0 0 3px var(--accent-wash);
  }

  .refresh-button.is-loading .icon { animation: spin 0.8s linear infinite; }

  /* ── Error ────────────────────────────────────────────────── */
  .error-banner {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 0 0 18px;
    padding: 12px 16px;
    border: 1px solid color-mix(in srgb, var(--danger) 30%, var(--glass-border));
    border-radius: var(--radius-lg);
    background: linear-gradient(165deg, var(--danger-wash), color-mix(in srgb, var(--danger-wash) 50%, transparent));
    box-shadow: 0 1px 0 var(--sheen) inset, 0 10px 24px -18px rgba(120, 40, 30, 0.45);
    color: var(--danger);
    font-size: 12.5px;
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
  }

  .error-banner .icon { width: 15px; height: 15px; }

  .error-banner p { margin: 0; }

  .error-banner button {
    margin-left: auto;
    padding: 1px 0;
    border-bottom: 1px solid currentColor;
    font-size: 12px;
    font-weight: 500;
  }

  /* ── Session ledger ───────────────────────────────────────── */
  .column-head {
    display: grid;
    grid-template-columns: var(--date-col) minmax(0, 1fr) var(--figures-col) 28px;
    gap: 20px;
    padding: 0 18px 10px;
    color: var(--faint);
    font-size: 10.5px;
  }

  .column-usage { text-align: right; }

  .session-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .session-list.is-busy {
    pointer-events: none;
    opacity: 0.55;
  }

  .session {
    position: relative;
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-xl);
    background: linear-gradient(155deg, var(--glass-top), var(--glass-bottom));
    box-shadow: var(--glass-shadow), 0 1px 0 var(--sheen) inset;
    overflow: hidden;
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    transition: border-color 0.22s ease, box-shadow 0.22s ease;
  }

  .session::before {
    content: "";
    position: absolute;
    top: 0;
    right: 14%;
    left: 14%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--sheen), transparent);
    pointer-events: none;
  }

  .session:hover {
    border-color: color-mix(in srgb, var(--accent) 22%, var(--glass-border));
    box-shadow: 0 26px 50px -26px rgba(24, 62, 96, 0.42), 0 1px 0 var(--sheen) inset;
  }

  .session.is-open {
    border-color: color-mix(in srgb, var(--accent) 30%, var(--glass-border));
    box-shadow: 0 30px 60px -30px rgba(24, 62, 96, 0.48), 0 1px 0 var(--sheen) inset;
  }

  .session-summary {
    display: grid;
    grid-template-columns: var(--date-col) minmax(0, 1fr) var(--figures-col) 28px;
    align-items: center;
    gap: 20px;
    padding: 18px;
    cursor: pointer;
    border-radius: var(--radius-xl);
    transition: background-color 0.18s ease;
  }

  .session-summary:hover,
  .session.is-open .session-summary { background: var(--surface-soft); }

  .session-date {
    display: flex;
    align-items: center;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    line-height: 1.35;
    white-space: nowrap;
  }

  .date-primary {
    color: var(--ink-soft);
    font-size: 11px;
    white-space: nowrap;
  }

  .session-main { min-width: 0; }

  .session-title {
    margin: 0 0 5px;
    overflow: hidden;
    color: var(--ink);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.4;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .session.is-open .session-title {
    white-space: normal;
  }

  .session-id-line {
    display: flex;
    align-items: center;
    gap: 3px;
    min-width: 0;
  }

  .session-id {
    max-width: 350px;
    overflow: hidden;
    color: var(--faint);
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.01em;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .session-path-line {
    display: flex;
    align-items: center;
    gap: 3px;
    min-width: 0;
    margin-top: 1px;
  }

  .session-path-line > .icon {
    width: 13px;
    height: 13px;
    flex: none;
    margin-right: 2px;
    color: var(--faint);
  }

  .session-path {
    max-width: 440px;
    overflow: hidden;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 10.5px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .mini-button {
    width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: none;
    border-radius: 7px;
    color: var(--faint);
    opacity: 0.75;
    transition: background-color 0.15s ease, color 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
  }

  .mini-button .icon { width: 13px; height: 13px; }

  .session-summary:hover .mini-button,
  .mini-button:focus-visible { opacity: 1; }

  .mini-button:hover {
    background: var(--accent-wash);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 22%, transparent) inset;
    color: var(--accent);
  }

  .mini-button.is-success {
    color: var(--positive);
    opacity: 1;
  }

  .mini-button.is-error {
    color: var(--danger);
    opacity: 1;
  }

  .mini-button.is-loading {
    color: var(--accent);
    opacity: 1;
  }

  .mini-spinner {
    width: 13px;
    height: 13px;
    display: block;
    flex: none;
    color: var(--accent);
    transform-origin: 50% 50%;
    animation: spin 0.75s linear infinite;
  }

  .session-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px 16px;
    min-width: 0;
    margin-top: 7px;
    color: var(--muted);
    font-size: 11.5px;
  }

  .meta-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
  }

  .meta-item .icon {
    width: 13px;
    height: 13px;
    color: var(--faint);
  }

  .meta-date { display: none; }

  .meta-key {
    color: var(--faint);
    font-size: 10.5px;
  }

  .meta-agent,
  .meta-model {
    color: var(--ink-soft);
    font-family: var(--font-mono);
    font-size: 10.5px;
  }

  .session-figures {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
    width: 100%;
    font-variant-numeric: tabular-nums;
  }

  .figure {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1px;
    min-width: 0;
    text-align: right;
  }

  .figure-value {
    overflow: hidden;
    max-width: 100%;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 12.5px;
    font-weight: 500;
    line-height: 1.35;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .figure-label {
    color: var(--faint);
    font-size: 10px;
    line-height: 1.3;
    white-space: nowrap;
  }

  .figure-cache .figure-value { color: var(--positive); }

  .figure-empty .figure-value {
    color: var(--faint);
    font-weight: 400;
  }

  .session-chevron {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid transparent;
    border-radius: var(--radius);
    color: var(--faint);
    transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.22s ease, box-shadow 0.18s ease;
  }

  .session-chevron .icon { width: 15px; height: 15px; }

  .session-summary:hover .session-chevron { color: var(--ink-soft); }

  .session-chevron:hover {
    border-color: var(--glass-border);
    background: var(--surface);
    box-shadow: 0 1px 0 var(--sheen) inset;
    color: var(--ink);
  }

  .session.is-open .session-chevron {
    border-color: color-mix(in srgb, var(--accent) 30%, transparent);
    background: var(--accent-wash);
    box-shadow: 0 0 18px -4px var(--accent-glow);
    transform: rotate(180deg);
    color: var(--accent);
  }

  /* ── Expanded detail ──────────────────────────────────────── */
  .session-detail {
    display: grid;
    grid-template-rows: 0fr;
    border-top: 1px solid transparent;
    background: linear-gradient(180deg, var(--surface-soft), transparent 70%);
    transition:
      grid-template-rows 0.34s cubic-bezier(0.22, 0.7, 0.3, 1),
      border-color 0.3s ease,
      box-shadow 0.3s ease;
  }

  .session.is-open .session-detail {
    grid-template-rows: 1fr;
    border-top-color: var(--glass-edge);
    box-shadow: 0 1px 0 var(--sheen) inset;
  }

  .session-detail-clip {
    min-height: 0;
    overflow: hidden;
    opacity: 0;
    transform: translateY(-5px);
    transition: opacity 0.2s ease, transform 0.34s cubic-bezier(0.22, 0.7, 0.3, 1);
  }

  .session.is-open .session-detail-clip {
    opacity: 1;
    transform: none;
    transition: opacity 0.28s ease 0.04s, transform 0.36s cubic-bezier(0.22, 0.7, 0.3, 1);
  }

  .session-usage {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 16px;
    margin: 0 18px;
    padding: 14px 0 14px calc(var(--date-col) + 20px);
    border-bottom: 1px solid var(--glass-edge);
  }

  .usage-item { min-width: 0; }

  .usage-label {
    display: block;
    overflow: hidden;
    color: var(--faint);
    font-size: 10px;
    line-height: 1.3;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .usage-value {
    display: block;
    overflow: hidden;
    margin-top: 2px;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    line-height: 1.35;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .usage-item.is-hit .usage-value { color: var(--positive); }

  .detail-inner {
    display: grid;
    grid-template-columns: var(--date-col) minmax(0, 1fr);
    gap: 20px;
    padding: 16px 18px 22px;
  }

  .detail-label {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding-top: 1px;
    color: var(--faint);
    font-size: 10.5px;
    line-height: 1.4;
  }

  .detail-count {
    color: var(--faint);
    font-family: var(--font-mono);
    font-size: 10px;
  }

  .detail-main { min-width: 0; }

  .message {
    padding-bottom: 14px;
  }

  .message + .message {
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }

  .message-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }

  .message-time {
    color: var(--faint);
    font-family: var(--font-mono);
    font-size: 10px;
    font-variant-numeric: tabular-nums;
  }

  .message-agent {
    color: var(--muted);
    font-size: 10.5px;
  }

  .message-fork {
    margin-left: auto;
    color: var(--muted);
    opacity: 0.9;
  }

  .message:hover .message-fork,
  .message-fork:focus-visible {
    opacity: 1;
  }

  .message-text {
    max-width: 78ch;
    margin: 0;
    color: var(--ink-soft);
    font-size: 13px;
    line-height: 1.7;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }

  .empty-inline,
  .inline-error,
  .loading-inline {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 12.5px;
  }

  .inline-error { color: var(--danger); }

  .inline-error .text-button { margin-left: 4px; }

  .spinner {
    width: 16px;
    height: 16px;
    flex: none;
    border: 1.5px solid var(--line-strong);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  .loading-state {
    min-height: 260px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--muted);
    font-size: 12.5px;
  }

  .loading-state .spinner { width: 18px; height: 18px; }

  /* ── Empty state ──────────────────────────────────────────── */
  .empty-state {
    max-width: 540px;
    padding: 56px 32px;
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-xl);
    background: linear-gradient(155deg, var(--glass-top), var(--glass-bottom));
    box-shadow: var(--glass-shadow), 0 1px 0 var(--sheen) inset;
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
  }

  .empty-title {
    margin: 0 0 6px;
    color: var(--ink);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .empty-copy {
    margin: 0 0 18px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.65;
  }

  .text-button {
    padding-bottom: 2px;
    border-bottom: 1px solid currentColor;
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 500;
  }

  .text-button:hover { color: var(--accent-strong); }

  /* ── Pagination ───────────────────────────────────────────── */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 26px 0 8px;
  }

  .page-numbers {
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .page-btn {
    min-width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 10px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
  }

  .page-btn:hover {
    border-color: var(--glass-border);
    background: var(--surface);
    box-shadow: 0 1px 0 var(--sheen) inset;
    color: var(--ink);
  }

  .page-btn.is-active {
    border-color: color-mix(in srgb, var(--accent) 70%, transparent);
    background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 78%, #ffffff), var(--accent));
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.45) inset, 0 8px 20px -10px var(--accent-glow);
    color: #ffffff;
    font-weight: 500;
  }

  .page-btn.is-active:hover {
    border-color: color-mix(in srgb, var(--accent) 80%, transparent);
    background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 82%, #ffffff), var(--accent));
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.45) inset, 0 8px 22px -10px var(--accent-glow);
    color: #ffffff;
  }

  [data-theme="dark"] .page-btn.is-active,
  [data-theme="dark"] .page-btn.is-active:hover { color: #07131e; }

  .page-btn:disabled {
    cursor: default;
    opacity: 0.3;
  }

  .page-btn:disabled:hover {
    border-color: transparent;
    background: none;
    color: var(--muted);
  }

  .page-btn .icon { width: 14px; height: 14px; }

  .page-ellipsis {
    min-width: 22px;
    color: var(--faint);
    font-family: var(--font-mono);
    font-size: 11px;
    text-align: center;
  }

  .pagination-info {
    color: var(--faint);
    font-family: var(--font-mono);
    font-size: 10.5px;
    white-space: nowrap;
  }

  /* ── Toast ────────────────────────────────────────────────── */
  .toast {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 50;
    max-width: min(440px, calc(100vw - 32px));
    padding: 12px 16px;
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    background: linear-gradient(160deg, var(--glass-top), var(--glass-bottom));
    box-shadow: var(--glass-shadow), 0 1px 0 var(--sheen) inset;
    color: var(--ink);
    font-size: 12.5px;
    line-height: 1.55;
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    backdrop-filter: blur(20px) saturate(160%);
  }

  .toast.is-error {
    border-color: color-mix(in srgb, var(--danger) 30%, var(--glass-border));
    color: var(--danger);
  }

  /* ── Conversation modal ───────────────────────────────────── */
  body.has-modal { overflow: hidden; }

  .conversation-modal {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .conversation-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(7, 19, 30, 0.5);
    -webkit-backdrop-filter: blur(5px);
    backdrop-filter: blur(5px);
  }

  [data-theme="light"] .conversation-backdrop {
    background: rgba(24, 62, 96, 0.32);
  }

  .conversation-dialog {
    position: relative;
    display: flex;
    flex-direction: column;
    width: min(980px, 100%);
    max-height: min(86vh, 920px);
    overflow: hidden;
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-xl);
    background: linear-gradient(155deg, var(--glass-top), var(--glass-bottom));
    box-shadow: var(--glass-shadow), 0 1px 0 var(--sheen) inset;
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
  }

  .conversation-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--line);
  }

  .conversation-heading { min-width: 0; }

  .conversation-title {
    margin: 0;
    color: var(--ink);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .conversation-meta {
    margin: 4px 0 0;
    color: var(--faint);
    font-family: var(--font-mono);
    font-size: 10.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .conversation-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 4px 20px 22px;
    overscroll-behavior: contain;
  }

  .conversation-body .loading-state { min-height: 240px; }

  .conv-message {
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
  }

  .conv-message:last-child { border-bottom: 0; }

  .conv-message-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .conv-role {
    flex: none;
    padding: 2px 9px;
    border-radius: var(--pill);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
  }

  .conv-user .conv-role {
    background: var(--accent-wash);
    color: var(--accent);
  }

  .conv-assistant .conv-role {
    background: color-mix(in srgb, var(--positive) 14%, transparent);
    color: var(--positive);
  }

  .conv-time {
    color: var(--faint);
    font-family: var(--font-mono);
    font-size: 10px;
    font-variant-numeric: tabular-nums;
  }

  .conv-meta {
    margin-left: auto;
    color: var(--muted);
    font-size: 10.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .conv-parts {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .conv-text {
    color: var(--ink-soft);
    font-size: 13px;
    line-height: 1.72;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .conv-user .conv-text { color: var(--ink); }

  .conv-part {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface-soft);
  }

  .conv-part > summary {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    cursor: pointer;
    list-style: none;
    color: var(--muted);
    font-size: 11.5px;
    user-select: none;
  }

  .conv-part > summary::-webkit-details-marker { display: none; }

  .conv-part > summary .icon { width: 13px; height: 13px; flex: none; }

  .conv-part[open] > summary { border-bottom: 1px solid var(--line); }

  .conv-tool-name {
    color: var(--ink-soft);
    font-family: var(--font-mono);
    font-size: 11.5px;
  }

  .conv-tool-summary {
    min-width: 0;
    overflow: hidden;
    color: var(--faint);
    font-size: 10.5px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .conv-status {
    margin-left: auto;
    padding: 1px 8px;
    border-radius: var(--pill);
    font-size: 10px;
  }

  .conv-status-completed {
    background: color-mix(in srgb, var(--positive) 12%, transparent);
    color: var(--positive);
  }

  .conv-status-error {
    background: var(--danger-wash);
    color: var(--danger);
  }

  .conv-status-running,
  .conv-status-pending {
    background: var(--accent-wash);
    color: var(--accent);
  }

  .conv-tool-body {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px 12px 12px;
  }

  .conv-field-label {
    display: block;
    margin-bottom: 4px;
    color: var(--faint);
    font-size: 10px;
  }

  .conv-pre {
    max-height: 340px;
    margin: 0;
    padding: 10px 12px;
    overflow: auto;
    border-radius: var(--radius);
    background: var(--bg-deep);
    color: var(--ink-soft);
    font-family: var(--font-mono);
    font-size: 11.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .conv-file,
  .conv-patch {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    color: var(--muted);
    font-size: 11.5px;
  }

  .conv-file .icon,
  .conv-patch .icon { width: 13px; height: 13px; flex: none; }

  .conv-patch code {
    margin-left: 6px;
    color: var(--ink-soft);
    font-family: var(--font-mono);
    font-size: 11px;
  }

  .conv-error {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 9px 12px;
    border-radius: var(--radius);
    background: var(--danger-wash);
    color: var(--danger);
    font-size: 12px;
    line-height: 1.55;
  }

  .conv-error .icon { width: 14px; height: 14px; flex: none; margin-top: 1px; }

  .detail-toolbar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
  }

  .detail-full-button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 11px;
    border: 1px solid var(--line-strong);
    border-radius: var(--pill);
    background: var(--surface-soft);
    color: var(--muted);
    font: inherit;
    font-size: 11.5px;
    transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease;
  }

  .detail-full-button .icon { width: 13px; height: 13px; }

  .detail-full-button:hover {
    border-color: color-mix(in srgb, var(--accent) 30%, var(--line-strong));
    background: var(--accent-wash);
    color: var(--accent);
  }

  /* ── Settings dialog ──────────────────────────────────────── */
  .settings-dialog {
    width: min(720px, 100%);
    max-height: min(84vh, 820px);
  }

  .settings-body {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 16px 20px 22px;
  }

  .settings-master {
    justify-content: space-between;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }

  .db-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .db-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface-soft);
  }

  .db-item.is-missing {
    border-color: color-mix(in srgb, var(--danger) 30%, var(--line));
  }

  .db-main {
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }

  .db-head {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .db-label {
    color: var(--ink-soft);
    font-size: 12.5px;
    font-weight: 600;
  }

  .db-badge {
    padding: 1px 6px;
    border-radius: var(--pill);
    background: var(--accent-wash);
    color: var(--accent);
    font-size: 9.5px;
  }

  .db-badge.is-missing {
    background: var(--danger-wash);
    color: var(--danger);
  }

  .mini-button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .db-path {
    overflow: hidden;
    color: var(--faint);
    font-family: var(--font-mono);
    font-size: 10.5px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .db-item.is-missing .db-path { color: var(--danger); }

  .db-actions {
    display: flex;
    flex: none;
    align-items: center;
    gap: 6px;
  }

  .db-add {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .db-add input {
    flex: 1;
    height: 36px;
    min-width: 0;
    padding: 0 12px;
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    background: var(--surface-soft);
    color: var(--ink);
    font-size: 12.5px;
    outline: none;
    transition: border-color 0.16s ease, box-shadow 0.16s ease;
  }

  .db-add input:focus {
    border-color: color-mix(in srgb, var(--accent) 62%, transparent);
    box-shadow: 0 0 0 3px var(--accent-wash);
  }

  .settings-hint {
    min-height: 16px;
    margin: 0;
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.5;
  }

  .settings-hint.is-error { color: var(--danger); }

  @media (max-width: 620px) {
    .conversation-modal { padding: 0; }
    .conversation-dialog {
      width: 100%;
      max-height: 100vh;
      height: 100vh;
      border: 0;
      border-radius: 0;
    }
